[package]
name = "transit-query"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.4.7", features = ["derive", "env"] }
csv = "1.3.0"
gtfs-schedule-types = { git = "file:///Users/kfirestack/Documents/src/github.com/firestack/gtfs-types", rev = "8240b4a60d0c0c41b19109b02a39e2b55b714cc0", features = ["from-dataset", "debug"] }
maplit = "1.0.2"
reqwest = { version = "0.11.22", features = ["blocking"] }
serde = { version = "1.0.189", features = ["derive"] }
serde_json = "1.0.107"
trustfall = { git = "https://github.com/obi1kenobi/trustfall.git", branch = "main" }
